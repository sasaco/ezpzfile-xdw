[package]
name = "ezpzxdw-raster"
description = "Draws a page of an XDW document to a PNG (fills, strokes, pictures and, with fonts, text)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ezpzxdw-core = { path = "../ezpzxdw-core" }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
